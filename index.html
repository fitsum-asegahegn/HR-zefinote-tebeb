<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>ፍኖተ ጥበብ — ዲጂታል መገኘት</title>
<meta name="theme-color" content="#14110f"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="icon" href="./icon-192.png"/>
<link rel="apple-touch-icon" href="./icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110f; --bg2:#1c1815; --card:#221d19;
    --amber:#f2a33c; --amber-dim:#8a5c22;
    --text:#f2ede6; --muted:#9c9187;
    --green:#4caf7d; --red:#e0605a;
    --border:#332c26;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Noto Sans Ethiopic','JetBrains Mono',monospace; padding-bottom:70px; }
  h1,h2,h3{ font-family:'Fraunces','Noto Sans Ethiopic',serif; color:var(--amber); }
  header{
    padding:18px 16px 10px; text-align:center; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--bg); z-index:10;
  }
  header h1{ font-size:1.25rem; margin:0 0 2px; }
  header .sub{ color:var(--muted); font-size:0.78rem; }
  header .motto{ color:var(--amber); font-size:0.72rem; font-style:italic; margin-top:4px; font-family:'Fraunces','Noto Sans Ethiopic',serif; }
  #langToggle{
    position:absolute; top:16px; right:14px; background:var(--bg2); color:var(--amber);
    border:1px solid var(--amber-dim); border-radius:20px; padding:5px 12px; font-size:0.72rem;
    font-family:'JetBrains Mono',monospace; font-weight:600;
  }
  #view{ padding:14px 14px 30px; max-width:640px; margin:0 auto; }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .stat-card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center; }
  .stat-num{ font-family:'JetBrains Mono',monospace; font-size:1.6rem; color:var(--amber); font-weight:700; }
  .stat-label{ font-size:0.72rem; color:var(--muted); margin-top:4px; }

  .section-title{ margin:22px 0 8px; font-size:1rem; }
  .list{ display:flex; flex-direction:column; gap:8px; }
  .list-row{ display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; gap:10px; }
  .sel-check{ display:flex; align-items:center; flex:0 0 auto; }
  .sel-check input[type="checkbox"]{ width:18px; height:18px; accent-color:var(--amber); }
  .muted{ color:var(--muted); font-size:0.78rem; }
  .row-actions{ display:flex; gap:6px; align-items:center; }

  .badge{ font-size:0.72rem; padding:4px 9px; border-radius:20px; font-family:'JetBrains Mono',monospace; white-space:nowrap; }
  .badge-red{ background:#3a201d; color:var(--red); }
  .badge-amber{ background:#3a2c15; color:var(--amber); }
  .badge-green{ background:#173a28; color:var(--green); }
  .phone-link{ color:var(--amber); text-decoration:underline; font-family:'JetBrains Mono',monospace; }

  button{ font-family:inherit; cursor:pointer; border:none; }
  .btn-primary{ background:var(--amber); color:#1a1410; font-weight:700; padding:10px 16px; border-radius:10px; font-size:0.85rem; }
  .btn-secondary{ background:var(--bg2); color:var(--text); border:1px solid var(--border); padding:9px 14px; border-radius:10px; font-size:0.82rem; }
  .btn-secondary.active-lang{ border-color:var(--amber); color:var(--amber); }
  .btn-small{ background:var(--bg2); color:var(--amber); border:1px solid var(--amber-dim); padding:6px 10px; border-radius:8px; font-size:0.74rem; }
  .file-btn{ display:inline-flex; align-items:center; justify-content:center; }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .text-input{ width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:10px; font-size:0.85rem; margin-bottom:10px; font-family:inherit; }
  .text-input.small{ width:70px; margin-bottom:0; padding:6px 8px; }
  .form-grid{ display:grid; grid-template-columns:1fr; gap:2px 10px; margin-bottom:10px; }
  .form-grid label{ font-size:0.75rem; color:var(--muted); margin-top:6px; }

  .scan-controls{ display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .scan-controls select{ background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:9px 10px; font-family:inherit; }

  .video-wrap{ position:relative; width:100%; max-width:420px; border-radius:12px; overflow:hidden; margin-bottom:8px; background:#000; }
  .video-wrap video{ width:100%; display:block; }
  .scan-reticle{ position:absolute; inset:14% 20%; pointer-events:none; }
  .scan-reticle .corner{ position:absolute; width:26px; height:26px; border:3px solid var(--amber); opacity:.9; }
  .scan-reticle .tl{ top:0; left:0; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
  .scan-reticle .tr{ top:0; right:0; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
  .scan-reticle .bl{ bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 6px; }
  .scan-reticle .br{ bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 6px 0; }
  #scanStatus{ display:flex; align-items:center; gap:6px; color:var(--green); font-family:var(--mono, monospace); font-size:0.78rem; }

  nav.tabs{ position:fixed; bottom:0; left:0; right:0; background:var(--bg2); border-top:1px solid var(--border); z-index:20; display:flex; }
  .tab-btn{ flex:1; background:transparent; color:var(--muted); padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:0.66rem; }
  .tab-btn .ic{ font-size:1.15rem; }
  .tab-btn.active{ color:var(--amber); }

  .modal{ position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal-inner{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; text-align:center; max-height:90vh; overflow-y:auto; }
  .modal-inner button{ margin-top:12px; }

  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:var(--amber); color:#1a1410; font-weight:700; padding:10px 20px;
    border-radius:20px; z-index:60; font-size:0.85rem; box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  .chart-box{ position:relative; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:8px; height:220px; overflow:hidden; }

  .auth-wrap{ max-width:380px; margin:40px auto; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; text-align:center; }
  .auth-wrap h2{ margin-top:0; }

  .print-only{ display:none; }
  @media print{
    header, nav.tabs, .toolbar, #memberSearch, #gradeFilter, #memberList{ display:none !important; }
    body{ background:#fff; color:#000; padding:0; }
    .print-only{ display:block !important; }
    @page{ size:A4; margin:8mm; }
    .qr-page{
      display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(4,1fr);
      gap:4mm; width:100%; height:277mm; page-break-after:always;
    }
    .qr-page:last-child{ page-break-after:auto; }
    .id-card{
      border:1px dashed #999; border-radius:2mm; display:flex; align-items:center;
      justify-content:space-around; padding:3mm; box-sizing:border-box; overflow:hidden;
    }
    .id-card .qr-half{ width:30mm; height:30mm; display:flex; align-items:center; justify-content:center; }
    .id-card .qr-half canvas, .id-card .qr-half img{ width:100% !important; height:100% !important; }
    .id-card .info-half{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2mm; flex:1; }
    .photo-box{ width:24mm; height:32mm; border:1.5pt solid #333; background:#fafafa; }
    .id-name{ font-size:9pt; font-weight:700; text-align:center; line-height:1.15; max-width:34mm; }
    .id-org{ font-size:6pt; color:#555; text-align:center; }
  }
</style>
</head>
<body>
  <header>
    <button id="langToggle" onclick="toggleLang()">EN</button>
    <h1 id="headerTitle">ፍኖተ ጥበብ — ዲጂታል መገኘት</h1>
    <div class="sub" id="headerSub">QR-based offline attendance · HR ንዑስ ክፍል</div>
    <div class="motto" id="headerMotto">አባላትን መጠበቅ፣ ማጽደቅ እና ማጽናት</div>
  </header>

  <div id="view"></div>

  <nav class="tabs" style="display:none;">
    <button class="tab-btn active" data-tab="dashboard" onclick="setTab('dashboard')"><span class="ic">🏠</span><span class="lbl">ዳሽቦርድ</span></button>
    <button class="tab-btn" data-tab="scan" onclick="setTab('scan')"><span class="ic">📷</span><span class="lbl">ስካን</span></button>
    <button class="tab-btn" data-tab="members" onclick="setTab('members')"><span class="ic">👥</span><span class="lbl">አባላት</span></button>
    <button class="tab-btn" data-tab="plan" onclick="setTab('plan')"><span class="ic">🗂️</span><span class="lbl">ዕቅድ</span></button>
    <button class="tab-btn" data-tab="reports" onclick="setTab('reports')"><span class="ic">📊</span><span class="lbl">ሪፖርት</span></button>
    <button class="tab-btn" data-tab="settings" onclick="setTab('settings')"><span class="ic">⚙️</span><span class="lbl">ቅንብር</span></button>
    <button class="tab-btn" data-tab="groups" onclick="setTab('groups')"><span class="icon">👪</span><span class="lbl">Groups</span></button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js with time adapter -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <!-- Zoom plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8/build/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="./config.js"></script>
  <script src="./i18n.js"></script>
  <script src="./ethiopian-calendar.js"></script>
  <script src="./auth.js"></script>
  <script src="./app.js"></script>
</body>
</html>
